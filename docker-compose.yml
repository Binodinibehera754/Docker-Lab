version: "3.9"

services:
  web:
    image: devops-webapp:1.0
    container_name: devops-webapp-compose
    ports:
      - "8081:80"
    networks:
      - devops-network

  redis:
    image: redis:latest
    container_name: redis-server
    volumes:
      - redis-data:/data
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge

volumes:
  redis-data:
